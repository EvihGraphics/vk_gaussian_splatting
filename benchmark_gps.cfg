# Gaussian Point Splatting (CUDA, PIPELINE_GPS_CUDA = 6) vs. Vulkan 3DGS rasterization.
#
# Requires a build with -DUSE_GPS_CUDA=ON. Run with:
#   python benchmark.py benchmark_gps.cfg GPS <path_to_3dgs_dataset_root> benchmark_results_gps.csv --headless
#
# Timings: in the profiler log the "GPU" column of the "GPS CUDA" / "GPS CUDA output" timers is
# measured with CUDA events (see GpsBridgeVk / gps_cuda), the other timers with Vulkan timestamps,
# so the "Frame" GPU time is the full GPU time of every pipeline.
#
# Every rendering sequence is kept below the temporal accumulation limit (1000 frames): once
# converged, the accumulating pipelines stop rendering and would not produce timings anymore.
# Sequence names are used as pipeline keys by benchmark.py (dataset GPS), keep them in sync.

SEQUENCE "Load scene and common settings"
--sequenceframes 64
--sequenceaverages 32
--sequenceresetframes 0
# preset 0 is the default camera
--activateCameraPreset 1
--maxShDegree 3
# CUDA event timings exclude the previous frame's Vulkan work
--gpsIsolateGpuTiming 1

SEQUENCE "3DGS Mesh"
--sequenceframes 512
--sequenceaverages 256
--pipeline 1
--sortStrategy 0
--shformat 0
--updateData

SEQUENCE "3DGS Mesh - screen shot"
--sequenceframes 1
--sequenceaverages 1
--saveImageBuffer 0
--saveImage "_benchmark/screenshot_3dgs.raw"
--saveImage "_benchmark/screenshot_3dgs.png"

SEQUENCE "3DGS Mesh stochastic"
--sequenceframes 512
--sequenceaverages 256
--pipeline 1
--sortStrategy 3
--shformat 0
--updateData

SEQUENCE "3DGS Mesh stochastic - screen shot"
--sequenceframes 1
--sequenceaverages 1
--saveImageBuffer 0
--saveImage "_benchmark/screenshot_3dgs_stochastic.raw"
--saveImage "_benchmark/screenshot_3dgs_stochastic.png"

SEQUENCE "GPS CUDA ss2"
--sequenceframes 512
--sequenceaverages 256
--pipeline 6
--sortStrategy 0
--gpsSupersampling 2
--gpsOcclusionCulling 1
--gpsHierarchicalCulling 1
--updateData

SEQUENCE "GPS CUDA ss2 - screen shot"
--sequenceframes 1
--sequenceaverages 1
--saveImageBuffer 0
--saveImage "_benchmark/screenshot_gps_ss2.raw"
--saveImage "_benchmark/screenshot_gps_ss2.png"

SEQUENCE "GPS CUDA ss1"
--sequenceframes 512
--sequenceaverages 256
--gpsSupersampling 1

SEQUENCE "GPS CUDA ss1 - screen shot"
--sequenceframes 1
--sequenceaverages 1
--saveImageBuffer 0
--saveImage "_benchmark/screenshot_gps_ss1.raw"
--saveImage "_benchmark/screenshot_gps_ss1.png"

SEQUENCE "GPS CUDA ss2 no culling"
--sequenceframes 512
--sequenceaverages 256
--gpsSupersampling 2
--gpsOcclusionCulling 0
--gpsHierarchicalCulling 0

SEQUENCE "GPS CUDA ss2 no culling - screen shot"
--sequenceframes 1
--sequenceaverages 1
--saveImageBuffer 0
--saveImage "_benchmark/screenshot_gps_ss2_noculling.raw"
--saveImage "_benchmark/screenshot_gps_ss2_noculling.png"
